<?xml version="1.0" encoding="UTF-8"?>
<!--
  AMD GPU Monitor icon: a graphics-card outline with a usage bar and a memory bar.
  SPDX-License-Identifier: GPL-2.0-or-later
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3340"/>
      <stop offset="1" stop-color="#1b1f28"/>
    </linearGradient>
  </defs>
  <!-- card body -->
  <rect x="6" y="14" width="52" height="30" rx="4" fill="url(#card)" stroke="#8a93a6" stroke-width="2"/>
  <!-- PCIe edge connector -->
  <rect x="12" y="44" width="30" height="5" fill="#8a93a6"/>
  <rect x="14" y="49" width="26" height="3" fill="#c9a24a"/>
  <g fill="#1b1f28">
    <rect x="17" y="49" width="2" height="3"/><rect x="21" y="49" width="2" height="3"/><rect x="25" y="49" width="2" height="3"/>
    <rect x="29" y="49" width="2" height="3"/><rect x="33" y="49" width="2" height="3"/><rect x="37" y="49" width="2" height="3"/>
  </g>
  <!-- bracket -->
  <rect x="2" y="12" width="4" height="34" rx="1" fill="#8a93a6"/>
  <!-- GPU die -->
  <rect x="12" y="20" width="14" height="14" rx="2" fill="#0d0f14" stroke="#8a93a6" stroke-width="1.5"/>
  <rect x="16" y="24" width="6" height="6" rx="1" fill="#e03c31"/>
  <!-- usage bar (highlight) -->
  <rect x="31" y="21" width="22" height="5" rx="2.5" fill="#3a3f4d"/>
  <rect x="31" y="21" width="15" height="5" rx="2.5" fill="#3daee9"/>
  <!-- VRAM bar (positive) -->
  <rect x="31" y="30" width="22" height="5" rx="2.5" fill="#3a3f4d"/>
  <rect x="31" y="30" width="9" height="5" rx="2.5" fill="#27ae60"/>
  <!-- fan hint -->
  <circle cx="19" cy="27" r="10" fill="none" stroke="#8a93a6" stroke-width="1" opacity="0.35"/>
</svg>
